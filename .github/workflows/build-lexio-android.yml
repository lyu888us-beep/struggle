name: build-lexio-android

on:
  push:
    paths:
      - 'lexio-mobile/**'
      - '.github/workflows/build-lexio-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build android apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lexio-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lexio-mobile/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: cp -r ../lexio-desktop/assets www

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Ensure release keystore
        run: |
          if [ ! -f android/app/release.p12 ] && [ -f ci-dist/release.p12 ]; then
            cp ci-dist/release.p12 android/app/release.p12
            echo "keystore restored from ci-dist"
          fi
          if [ ! -f android/app/release.p12 ]; then
            keytool -genkeypair \
              -keystore android/app/release.p12 -storetype PKCS12 \
              -alias lexio -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass lexio2026 -keypass lexio2026 \
              -dname "CN=Lexio, O=Lexio, C=US"
            echo "new keystore generated (will be committed with artifacts)"
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          (cd android && ./gradlew assembleRelease --no-daemon) 2>&1 | tee gradle-output.txt

      - name: Publish build log
        if: always()
        shell: bash
        run: |
          {
            echo '### android build log'
            echo '```'
            tail -c 60000 gradle-output.txt 2>/dev/null || echo '(no log produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error title=android build failed::$(tail -c 1200 gradle-output.txt 2>/dev/null | tr '\n' '|')"
          fi

      - name: Stage artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p ci-dist
          cp -f android/app/build/outputs/apk/release/*.apk ci-dist/ 2>/dev/null || true
          cp -f android/app/release.p12 ci-dist/ 2>/dev/null || true
          cp -f gradle-output.txt ci-dist/build-log-android.txt 2>/dev/null || true
          echo '::notice::ci-dist contents:'
          ls -la ci-dist

      - name: Upload artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexio-android
          path: lexio-mobile/ci-dist/*
          if-no-files-found: warn
          retention-days: 30

      - name: Commit artifacts to branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-dist
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit -m "ci: android artifacts [skip ci]"
          if ! git push 2>&1 | tee /tmp/push.log; then
            echo "::error::git push failed: $(cat /tmp/push.log)"
            exit 1
          fi
