name: build-lexio-desktop

on:
  push:
    paths:
      - 'lexio-desktop/**'
      - '.github/workflows/build-lexio-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lexio-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lexio-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build-output.txt
        env:
          # 未配置代码签名证书时跳过自动发现，避免 macOS 构建卡住
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish build log to summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} build log"
            echo '```'
            tail -c 60000 build-output.txt 2>/dev/null || echo '(no log produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexio-${{ matrix.os }}
          path: |
            lexio-desktop/dist/*.exe
            lexio-desktop/dist/*.AppImage
            lexio-desktop/dist/*.deb
            lexio-desktop/dist/*.dmg
            lexio-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # 把构建产物提交回当前分支，便于从 github.com 拉取后转存 Google Drive
  collect:
    name: commit artifacts to branch
    if: ${{ !cancelled() }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-raw
          merge-multiple: true

      - name: Stage artifacts
        run: |
          mkdir -p lexio-desktop/ci-dist
          find ci-raw -type f -exec cp -f {} lexio-desktop/ci-dist/ \;
          echo 'Collected files:'
          ls -la lexio-desktop/ci-dist

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lexio-desktop/ci-dist
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit -m "ci: desktop build artifacts [skip ci]"
          git push
