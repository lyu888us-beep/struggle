name: build-lexio-desktop

on:
  push:
    paths:
      - 'lexio-desktop/**'
      - '.github/workflows/build-lexio-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lexio-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lexio-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # 未配置代码签名证书时跳过自动发现，避免 macOS 构建卡住
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lexio-${{ matrix.os }}
          path: |
            lexio-desktop/dist/*.exe
            lexio-desktop/dist/*.AppImage
            lexio-desktop/dist/*.deb
            lexio-desktop/dist/*.dmg
            lexio-desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
