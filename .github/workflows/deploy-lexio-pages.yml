name: deploy-lexio-pages

on:
  push:
    paths:
      - 'lexio-pwa-full/**'
      - '.github/workflows/deploy-lexio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy pwa to github pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lexio-pwa-full

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Pages deploy failed::检查 github-pages 环境与 Pages 设置（详情见本任务日志）"
